pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// local composite dependency on the CloudLib project in the parent directory
includeBuild('..') {
    dependencySubstitution {
        substitute module('dev.vfyjxf.cloudlib:cloudlib') using project(':')
    }
}

rootProject.name = 'inworldui'
