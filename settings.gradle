pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    // also resolves 'dev.vfyjxf.cloudlib.lang' when this build is included
    // inside another composite (e.g. the nimbus dev build, which lives in
    // its own repository alongside this checkout)
    includeBuild 'cloudlang-plugin'
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

