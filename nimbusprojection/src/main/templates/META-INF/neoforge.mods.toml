modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT License"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
    Nimbus Projection — CloudLib in-world UI runtime and demo features:
    face-mounted, floating, follow, dock and holographic panels with
    point/inspect/trace interaction and world-as-UI item transfer.
'''
authors = "vfyjxf_"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "cloudlib"
type = "required"
versionRange = "[${cloudlib_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "AFTER"
side = "BOTH"
