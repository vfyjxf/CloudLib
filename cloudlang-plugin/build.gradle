plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.1'
}

group = 'dev.vfyjxf'
version = '0.1.0'
description = 'Distributed yaml-based translation system for Minecraft mods'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/vfyjxf/CloudLib'
    vcsUrl = 'https://github.com/vfyjxf/CloudLib.git'
    plugins {
        cloudLang {
            id = 'dev.vfyjxf.cloudlib.lang'
            implementationClass = 'dev.vfyjxf.cloudlib.gradle.lang.CloudLangPlugin'
            displayName = 'CloudLib CloudLang'
            description = 'Distributed yaml translation system: per-locale multi-file yaml sources are packed into vanilla lang json at build time, together with a generated typed key class (configurable name, package and naming style).'
            tags.set(['minecraft', 'neoforge', 'translation', 'lang', 'yaml'])
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
