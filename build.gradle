import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.122'
    id "me.champeau.jmh" version "0.7.2"
    id 'dev.vfyjxf.cloudlib.lang'
    id 'dev.vfyjxf.cloudlib.style'
    id "net.ltgt.errorprone" version "4.4.0"
}

cloudLang {
    modId = 'cloudlib'
    packageName = 'dev.vfyjxf.cloudlib.data.lang'
    className = 'CloudLang'
    constantNameStyle = 'camel'
}

version = project.mod_version
group = project.maven_group

static def isJetBrainsRuntime() {
    return System.getProperty('java.vm.vendor').contains('JetBrains')
}

base {
    archivesName = mod_id
}

// the cloudstyle plugin unpacks its JDT formatter profile into build/cloudstyle at configuration
// time — a plain file write during configuration, not a task output — so a clean that wiped
// build/ wholesale would leave spotless reading a profile the clean step had just deleted. The
// profile survives; everything else under build/ is discarded as before
tasks.named('clean', Delete) {
    setDelete(fileTree('build') { exclude 'cloudstyle/**' })
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('build/generated/datagen/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        dumpClient {
            client()
            gameDirectory = project.file('runs/dump')
            systemProperty 'cloudlib.dump', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty('terminal.jline', 'true')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets {
    main {
        //datagen output lives next to the lang yaml under build/, like the modMetadata dir
        resources {
            srcDir layout.buildDirectory.dir('generated/datagen/resources')
            exclude '**/.cache/**'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.quiltmc.org/repository/release/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://dvs1.progwml6.com/files/maven/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.shedaniel.me" }
    maven { url = "https://repo.kenzie.mx/releases" }
    maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url = "https://maven.minecraftforge.net" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    additionalRuntimeClasspath(api("org.eclipse.collections:eclipse-collections-api:13.0.0"))
    jarJar("org.eclipse.collections:eclipse-collections-api:[13.0.0,)") {
        version {
            prefer("13.0.0")
        }
    }
    additionalRuntimeClasspath(api("org.eclipse.collections:eclipse-collections:13.0.0"))
    jarJar("org.eclipse.collections:eclipse-collections:[13.0.0,)") {
        version {
            prefer("13.0.0")
        }
    }
    additionalRuntimeClasspath(api("dev.vfyjxf:taffy:1.1.3"))
    jarJar("dev.vfyjxf:taffy:1.1.3") {
        version {
            prefer("1.1.3")
        }
    }
    additionalRuntimeClasspath(api("net.lenni0451:Reflect:1.4.0"))
    jarJar "net.lenni0451:Reflect:1.4.0"

//    compileOnly 'com.google.auto.service:auto-service:1.1.1'
//    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testImplementation "net.neoforged:testframework:${project.neo_version}"
    testImplementation 'com.palantir.javapoet:javapoet:0.6.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    jmh "org.openjdk.jmh:jmh-core:1.37"
    jmh "org.openjdk.jmh:jmh-generator-annprocess:1.37"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.37"

    testCompileOnly 'com.google.auto.service:auto-service:1.1.1'
    testAnnotationProcessor 'com.google.auto.service:auto-service:1.1.1'

    // JSpecify is what the sources annotate with, so consumers compiling against this library
    // need it on their compile classpath; it stays off the runtime classpath.
    compileOnlyApi 'org.jspecify:jspecify:1.0.1'
    testCompileOnly 'org.jspecify:jspecify:1.0.1'
    // JetBrains annotations carry the non-null semantics JSpecify has no equivalent for
    // (@ApiStatus, @Contract, @Range, @Unmodifiable, @MustBeInvokedByOverriders)
    compileOnly 'org.jetbrains:annotations:26.1.0'
    testCompileOnly 'org.jetbrains:annotations:26.1.0'

    // NullAway 0.12.15 is built and tested against Error Prone 2.42.0
    errorprone 'com.uber.nullaway:nullaway:0.12.15'
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events 'failed'
        showStackTraces = true
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            jei_version            : jei_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

// NullAway runs as an Error Prone plugin over every source set (main, test). OnlyNullMarked
// restricts the analysis to code carrying @NullMarked, which keeps Minecraft, NeoForge and
// third-party boundaries out of it — those carry no JSpecify annotations to reason about.
// disableAllChecks keeps Error Prone's stock checks off: this wiring is a null-safety pass,
// and with them on the build fails on 4 pre-existing findings (NoCanIgnoreReturnValueOnClasses,
// MathRoundIntLong) unrelated to nullability.
// Stage A records findings at WARN; the level tightens to ERROR once they are cleared.
tasks.withType(JavaCompile).configureEach {
    // javac caps diagnostics at 100 by default; the NullAway sweep needs the whole list
    options.compilerArgs.addAll(['-Xmaxwarns', '2000', '-Xmaxerrs', '2000'])
    options.errorprone {
        disableAllChecks = true
        option("NullAway:OnlyNullMarked", "true")
        check("NullAway", CheckSeverity.WARN)
    }
}

java {
    withSourcesJar()
}
// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.maven_group
            artifactId = project.mod_id
            version = project.mod_version
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


